# Dev-only Postgres. Το app ΔΕΝ τρέχει εδώ — αυτό ζει στο Railway (deploy από GitHub),
# όπου το DATABASE_URL το δίνει το Railway Postgres plugin.
#
#   npm run db:up      # ξεκίνα
#   npm run migrate    # εφάρμοσε migrations (δε χρειάζεται psql στο host)
#   npm run db:psql    # psql shell μέσα στο container
#
# Το tag κρατά major version ίδιο με ό,τι έχει provisionάρει το Railway Postgres,
# ώστε να μη διαφέρει dev από prod.

services:
  db:
    image: postgres:16-alpine
    container_name: argus-trench-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus_trench_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argus -d argus_trench_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
